name: Refresh FAC schedule

# Re-scrape the FAC group-exercise schedule and commit any changes so the
# published GitHub Pages site stays current.

on:
  schedule:
    # Mondays at 11:00 UTC (~6:00 AM Central). Adjust as you like.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh Les Mills descriptions
        # Best-effort: if lesmills.com is unreachable, existing descriptions are
        # kept and the build still runs.
        run: python3 fetch_descriptions.py || true

      - name: Scrape and rebuild site
        run: python3 build.py

      - name: Commit changes if anything changed
        run: |
          if [ -n "$(git status --porcelain index.html data.json fayac_raw.html descriptions.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html data.json fayac_raw.html descriptions.json
            git commit -m "chore: refresh FAC schedule + class descriptions"
            git push
            echo "Updated and pushed."
          else
            echo "No changes."
          fi
