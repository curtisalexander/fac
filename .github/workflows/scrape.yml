name: Refresh FAC schedule

# Re-scrape the FAC group-exercise schedule and commit any changes so the
# published GitHub Pages site stays current.

on:
  schedule:
    # Mondays at 11:00 UTC (~6:00 AM Central). Adjust as you like.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape and rebuild site
        run: python3 build.py

      - name: Commit changes if the schedule changed
        run: |
          if [ -n "$(git status --porcelain index.html data.json fayac_raw.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html data.json fayac_raw.html
            git commit -m "chore: refresh FAC schedule"
            git push
            echo "Schedule updated and pushed."
          else
            echo "No schedule changes."
          fi
